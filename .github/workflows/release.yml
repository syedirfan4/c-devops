name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make calc LDFLAGS=-static
      - run: mv calc calc-linux-x86_64
      - run: gh release create "$GITHUB_REF_NAME" calc-linux-x86_64 --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
